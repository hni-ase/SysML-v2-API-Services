version: '3.8'
services:
  postgres:
    image: postgres:latest
    container_name: sysml2-postgres
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: sysml2
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword
      DB_NAME: sysml2
    ports:
      - "9000:9000"
    command: ./entrypoint.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/docs", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
volumes:
  pgdata:
